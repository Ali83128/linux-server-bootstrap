# Managed by linux-server-bootstrap. Local edits are overwritten on the next run.
# Named 10-* so it loads before distro drop-ins: sshd keeps the first value it reads.
Port {{SSH_PORT}}
PermitRootLogin no
PasswordAuthentication {{PASSWORD_AUTH}}
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AllowUsers {{ADMIN_USER}}
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
